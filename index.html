<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kiosque Météo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/weather.css">
  <link rel="stylesheet" href="styles/modules.css">
</head>
<body>

<script>
// Les navigateurs bloquent les modules JS (import/export) quand la page
// est ouverte en double-clic (file://), avec une erreur qui ressemble à
// du CORS dans la console. Ce script (non-module) s'exécute quand même
// dans ce cas-là, contrairement à app.js — on peut donc prévenir clairement
// plutôt que de laisser un écran figé sans explication.
if (location.protocol === 'file:') {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#070910;color:#ECF0F7;'
    + 'display:flex;flex-direction:column;align-items:center;justify-content:center;'
    + 'gap:1.2rem;font-family:system-ui,sans-serif;text-align:center;padding:2rem;';

  var titre = document.createElement('div');
  titre.style.cssText = 'font-size:1.6rem;font-weight:600;';
  titre.textContent = 'Cette page doit être servie via HTTP, pas ouverte comme fichier';

  var detail = document.createElement('div');
  detail.style.cssText = 'font-size:1.05rem;opacity:.75;max-width:38rem;line-height:1.5;';
  detail.textContent = 'Les navigateurs bloquent les modules JavaScript quand la page est ouverte '
    + 'directement (file://) — double-clique sur demarrer.bat à la racine du projet, '
    + 'ou lance python -m http.server puis ouvre http://localhost:8000.';

  overlay.appendChild(titre);
  overlay.appendChild(detail);
  document.body.appendChild(overlay);
}
</script>

<div id="ecran">
  <header id="bandeau">
    <div id="lieu">—</div>
    <div id="horloge">--:--</div>
  </header>

  <div id="pages">
    <main id="principal">
      <div id="icone"></div>
      <div>
        <div id="temperature">--<i>°</i></div>
        <div id="condition">Connexion…</div>
        <div id="mesures"></div>
      </div>
      <div id="modules">
        <div id="modules-corps"></div>
        <div id="modules-points"></div>
      </div>
    </main>
    <section id="ruban"></section>
  </div>

  <nav id="jours"></nav>
</div>

<div id="panne">
  <h1>Pas de données météo</h1>
  <p>Vérifie la connexion réseau du Raspberry Pi</p>
</div>

<div id="fenetre">
  <button type="button" class="fermer" aria-label="Fermer">✕</button>
  <div id="fenetre-corps"></div>
</div>

<div id="horloge-grand">
  <div id="horloge-grand-heure">--:--</div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
